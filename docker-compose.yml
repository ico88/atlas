# ATLAS full stack.
#
#   docker compose up --build
#
# Only the reverse proxy publishes a port to the host. PostgreSQL and Redis are
# reachable only on the internal network (spec §13: never expose them publicly).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atlas

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atlas

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    command: ["api"]
    environment:
      ATLAS_ENV: ${ATLAS_ENV:-development}
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
      ATLAS_DATABASE_URL: ${ATLAS_DATABASE_URL:-postgresql+asyncpg://atlas:atlas@postgres:5432/atlas}
      ATLAS_REDIS_URL: ${ATLAS_REDIS_URL:-redis://redis:6379/0}
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-}
      ATLAS_ACCESS_TOKEN_EXPIRE_MINUTES: ${ATLAS_ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      ATLAS_ADMIN_EMAIL: ${ATLAS_ADMIN_EMAIL:-}
      ATLAS_ADMIN_PASSWORD: ${ATLAS_ADMIN_PASSWORD:-}
      ATLAS_NODE_JOIN_TOKEN: ${ATLAS_NODE_JOIN_TOKEN:-}
      ATLAS_NODE_OFFLINE_AFTER_SECONDS: ${ATLAS_NODE_OFFLINE_AFTER_SECONDS:-60}
      ATLAS_OLLAMA_URL: ${ATLAS_OLLAMA_URL:-http://ollama:11434}
      ATLAS_DEFAULT_MODEL: ${ATLAS_DEFAULT_MODEL:-}
      # Web tools (ROADMAP PR 15) — off unless enabled; defaults target the
      # optional SearXNG service below (start it with `--profile web`).
      ATLAS_WEB_TOOLS_ENABLED: ${ATLAS_WEB_TOOLS_ENABLED:-false}
      ATLAS_WEB_SEARCH_PROVIDER: ${ATLAS_WEB_SEARCH_PROVIDER:-searxng}
      ATLAS_WEB_SEARCH_URL: ${ATLAS_WEB_SEARCH_URL:-http://searxng:8080/search}
      ATLAS_WEB_MAX_RESULTS: ${ATLAS_WEB_MAX_RESULTS:-5}
      ATLAS_WEB_FETCH_TIMEOUT: ${ATLAS_WEB_FETCH_TIMEOUT:-10}
      ATLAS_WEB_ALLOW_PRIVATE_IPS: ${ATLAS_WEB_ALLOW_PRIVATE_IPS:-false}
      ATLAS_WEB_DOMAIN_ALLOWLIST: ${ATLAS_WEB_DOMAIN_ALLOWLIST:-}
      ATLAS_WEB_DOMAIN_DENYLIST: ${ATLAS_WEB_DOMAIN_DENYLIST:-}
      ATLAS_CONVERSATION_MAX_PARALLEL: ${ATLAS_CONVERSATION_MAX_PARALLEL:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - atlas

  worker:
    build:
      context: ./apps/backend
    restart: unless-stopped
    command: ["worker"]
    environment:
      ATLAS_ENV: ${ATLAS_ENV:-development}
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
      ATLAS_DATABASE_URL: ${ATLAS_DATABASE_URL:-postgresql+asyncpg://atlas:atlas@postgres:5432/atlas}
      ATLAS_REDIS_URL: ${ATLAS_REDIS_URL:-redis://redis:6379/0}
      ATLAS_MAX_CONCURRENT_GLOBAL: ${ATLAS_MAX_CONCURRENT_GLOBAL:-0}
      ATLAS_MAX_CONCURRENT_PER_USER: ${ATLAS_MAX_CONCURRENT_PER_USER:-0}
      ATLAS_MAX_CONCURRENT_PER_TYPE: ${ATLAS_MAX_CONCURRENT_PER_TYPE:-0}
      ATLAS_TASK_MAX_RETRIES: ${ATLAS_TASK_MAX_RETRIES:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - atlas

  frontend:
    build:
      context: ./apps/frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    networks:
      - atlas

  # Local LLM inference (spec §4). Optional: enable with `--profile ai`.
  # The backend falls back to the echo provider when Ollama is not running.
  # Pull a model after start:  docker compose exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - atlas

  # Optional self-hosted web search (ROADMAP PR 15). Enable with `--profile web`.
  # ATLAS talks to its JSON API; result pages are fetched through the SSRF guard.
  searxng:
    image: searxng/searxng:latest
    profiles: ["web"]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./infrastructure/searxng:/etc/searxng:rw
    networks:
      - atlas

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Host ports are configurable to avoid clashes (e.g. another server on 80).
      - "${ATLAS_HTTP_PORT:-80}:80"
      - "${ATLAS_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - atlas

networks:
  atlas:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  ollamadata:
